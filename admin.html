<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard RSVP — Wedding</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf6ef;
        color: #2f2a26;
        padding: 1.5rem;
        line-height: 1.6;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #e2d8c9;
      }
      h1 {
        font-size: 1.4rem;
        color: #b08d57;
      }
      #status {
        font-size: 0.8rem;
        color: #6b635a;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
      }

      button {
        padding: 0.55rem 1rem;
        border-radius: 8px;
        border: 1px solid #b08d57;
        background: #b08d57;
        color: #fff;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.85;
      }
      button.btn-danger {
        background: #c0392b;
        border-color: #c0392b;
      }
      button.btn-small {
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.8rem;
        margin-bottom: 1.5rem;
      }
      .stat {
        background: #fff;
        padding: 1rem;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(47, 42, 38, 0.06);
        text-align: center;
      }
      .stat .num {
        display: block;
        font-size: 1.8rem;
        font-weight: 700;
        color: #b08d57;
        line-height: 1.1;
      }
      .stat span:last-child {
        font-size: 0.75rem;
        color: #6b635a;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .filters {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .filters input,
      .filters select {
        padding: 0.55rem 0.9rem;
        border: 1px solid #e2d8c9;
        border-radius: 8px;
        background: #fff;
        font: inherit;
        font-size: 0.88rem;
        flex: 1;
        min-width: 180px;
      }
      .filters input:focus,
      .filters select:focus {
        outline: none;
        border-color: #b08d57;
      }

      .table-wrap {
        background: #fff;
        border-radius: 12px;
        overflow: auto;
        box-shadow: 0 4px 16px rgba(47, 42, 38, 0.06);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
      }
      th,
      td {
        padding: 0.8rem 1rem;
        text-align: left;
        border-bottom: 1px solid #f2e9dc;
        font-size: 0.87rem;
        vertical-align: top;
      }
      th {
        background: #faf6ef;
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b635a;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      tr:hover td {
        background: #fdfbf7;
      }

      .badge {
        display: inline-block;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .badge-hadir {
        background: #e6f2e8;
        color: #2e7d32;
      }
      .badge-tidak {
        background: #fbeae8;
        color: #c0392b;
      }
      .badge-ragu {
        background: #fdf3e0;
        color: #b07d18;
      }

      /* Modal Edit */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal.show {
        display: flex;
      }
      .modal-content {
        background: #fff;
        border-radius: 12px;
        padding: 1.5rem;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .modal-content h2 {
        margin-bottom: 1rem;
        font-size: 1.2rem;
        color: #b08d57;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #e2d8c9;
        border-radius: 8px;
        font: inherit;
        font-size: 0.9rem;
        background: #faf6ef;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .btn-cancel {
        background: #e2d8c9;
        border-color: #e2d8c9;
        color: #2f2a26;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Dashboard RSVP Pernikahan</h1>
        <p id="status">Memuat data...</p>
      </div>
      <div class="actions">
        <button onclick="loadData()">🔄 Refresh</button>
        <button onclick="exportCSV()">⬇️ Export CSV</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="filters">
      <input
        id="search"
        type="search"
        placeholder="🔍 Cari nama atau ucapan..."
      />
      <select id="filterAtt">
        <option value="">Semua Kehadiran</option>
        <option value="Hadir">Hadir</option>
        <option value="Tidak Hadir">Tidak Hadir</option>
        <option value="Ragu-ragu">Ragu-ragu</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Waktu</th>
            <th>Nama</th>
            <th>Kehadiran</th>
            <th>Tamu</th>
            <th>Ucapan</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td
              colspan="7"
              style="text-align: center; padding: 2rem; color: #999"
            >
              Memuat...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal Edit -->
    <div class="modal" id="editModal">
      <div class="modal-content">
        <h2>Edit Data RSVP</h2>
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="editName" />
        </div>
        <div class="form-group">
          <label>Kehadiran</label>
          <select id="editAtt">
            <option value="Hadir">Hadir</option>
            <option value="Tidak Hadir">Tidak Hadir</option>
            <option value="Ragu-ragu">Ragu-ragu</option>
          </select>
        </div>
        <div class="form-group">
          <label>Jumlah Tamu</label>
          <input type="number" id="editGuests" min="1" max="10" />
        </div>
        <div class="form-group">
          <label>Ucapan</label>
          <textarea id="editMessage" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Batal</button>
          <button id="btnSave" onclick="saveEdit()">Simpan Perubahan</button>
        </div>
      </div>
    </div>

    <script>
      // ============================ GANTI DI SINI ============================
      const API_URL =
        "https://script.google.com/macros/s/AKfycbwUK04WEX-OxUmXKX_Hamj_j9yxWZ7fOHVqsIAYnrTHv3xXJW9kvoZl9DbHsctakUwt/exec";
      const ADMIN_TOKEN = "WmJYPyqdNCQoYQwv15XsKpkOVjepkAw6"; // Pastikan pakai W di depan
      // =======================================================================

      let allData = [];

      async function loadData() {
        const status = document.getElementById("status");
        status.textContent = "Memuat data...";
        status.style.color = "";
        try {
          const url = `${API_URL}?action=list_admin&token=${encodeURIComponent(ADMIN_TOKEN)}&t=${Date.now()}`;
          const res = await fetch(url);
          const json = await res.json();
          if (!json.ok) throw new Error(json.error || "Gagal");
          allData = json.data;
          status.textContent = `Terakhir diperbarui: ${new Date().toLocaleTimeString("id-ID")} · ${allData.length} data`;
          renderStats();
          renderTable();
        } catch (err) {
          status.textContent = "❌ " + err.message;
          status.style.color = "#c0392b";
        }
      }

      function renderStats() {
        const hadir = allData.filter((d) => d.attendance === "Hadir");
        const totalGuests = hadir.reduce((s, d) => s + (d.guests || 1), 0);
        const stats = [
          { label: "Total RSVP", value: allData.length },
          { label: "Hadir", value: hadir.length },
          {
            label: "Tidak Hadir",
            value: allData.filter((d) => d.attendance === "Tidak Hadir").length,
          },
          {
            label: "Ragu-ragu",
            value: allData.filter((d) => d.attendance === "Ragu-ragu").length,
          },
          { label: "Total Tamu", value: totalGuests },
        ];
        document.getElementById("stats").innerHTML = stats
          .map(
            (s) =>
              `<div class="stat"><span class="num">${s.value}</span><span>${s.label}</span></div>`,
          )
          .join("");
      }

      function renderTable() {
        const search = document.getElementById("search").value.toLowerCase();
        const filterAtt = document.getElementById("filterAtt").value;

        const filtered = allData.filter((d) => {
          const matchSearch =
            !search ||
            d.name.toLowerCase().includes(search) ||
            d.message.toLowerCase().includes(search);
          const matchAtt = !filterAtt || d.attendance === filterAtt;
          return matchSearch && matchAtt;
        });

        const tbody = document.getElementById("tbody");
        if (!filtered.length) {
          tbody.innerHTML =
            '<tr><td colspan="7" style="text-align:center;padding:3rem;color:#999">Tidak ada data.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered
          .map(
            (d, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${new Date(d.timestamp).toLocaleString("id-ID")}</td>
        <td><strong>${escapeHtml(d.name)}</strong></td>
        <td><span class="badge badge-${badgeKey(d.attendance)}">${escapeHtml(d.attendance)}</span></td>
        <td>${d.guests}</td>
        <td>${escapeHtml(d.message || "—")}</td>
        <td>
          <button class="btn-small" onclick="openEdit('${d.id}')">✏️ Edit</button>
          <button class="btn-small btn-danger" onclick="deleteData('${d.id}', '${escapeHtml(d.name)}')">🗑️ Hapus</button>
        </td>
      </tr>
    `,
          )
          .join("");
      }

      function badgeKey(att) {
        if (att === "Hadir") return "hadir";
        if (att === "Tidak Hadir") return "tidak";
        return "ragu";
      }

      function escapeHtml(str) {
        return String(str || "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }

      // ==========================================
      // FUNGSI HAPUS DATA
      // ==========================================
      async function deleteData(id, name) {
        if (
          !confirm(
            `Apakah Anda yakin ingin menghapus data RSVP dari "${name}"?`,
          )
        )
          return;

        const status = document.getElementById("status");
        status.textContent = "Menghapus data...";

        try {
          // Gunakan mode no-cors karena kita hanya butuh datanya terkirim
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "delete",
              token: ADMIN_TOKEN,
              id: id,
            }),
          });

          // Tunggu 1.5 detik agar Google Sheets selesai memproses
          await new Promise((r) => setTimeout(r, 1500));
          loadData(); // Refresh tabel
        } catch (err) {
          alert("Gagal menghapus data: " + err.message);
          status.textContent = "Gagal menghapus.";
        }
      }

      // ==========================================
      // FUNGSI EDIT DATA (Buka Modal)
      // ==========================================
      function openEdit(id) {
        const data = allData.find((d) => d.id === id);
        if (!data) return alert("Data tidak ditemukan");

        document.getElementById("editId").value = data.id;
        document.getElementById("editName").value = data.name;
        document.getElementById("editAtt").value = data.attendance;
        document.getElementById("editGuests").value = data.guests;
        document.getElementById("editMessage").value = data.message;

        document.getElementById("editModal").classList.add("show");
      }

      function closeModal() {
        document.getElementById("editModal").classList.remove("show");
      }

      // ==========================================
      // FUNGSI SIMPAN PERUBAHAN EDIT
      // ==========================================
      async function saveEdit() {
        const id = document.getElementById("editId").value;
        const name = document.getElementById("editName").value.trim();
        const attendance = document.getElementById("editAtt").value;
        const guests = document.getElementById("editGuests").value;
        const message = document.getElementById("editMessage").value.trim();

        if (name.length < 2) return alert("Nama minimal 2 karakter");

        const btn = document.getElementById("btnSave");
        btn.disabled = true;
        btn.textContent = "Menyimpan...";

        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "update",
              token: ADMIN_TOKEN,
              id: id,
              name: name,
              attendance: attendance,
              guests: Number(guests),
              message: message,
            }),
          });

          closeModal();
          btn.disabled = false;
          btn.textContent = "Simpan Perubahan";

          document.getElementById("status").textContent =
            "Menyimpan perubahan...";
          // Tunggu sebentar lalu refresh data
          await new Promise((r) => setTimeout(r, 1500));
          loadData();
        } catch (err) {
          alert("Gagal menyimpan: " + err.message);
          btn.disabled = false;
          btn.textContent = "Simpan Perubahan";
        }
      }

      function exportCSV() {
        if (!allData.length) {
          alert("Belum ada data untuk di-export.");
          return;
        }
        const headers = ["Waktu", "Nama", "Kehadiran", "Jumlah Tamu", "Ucapan"];
        const rows = allData.map((d) => [
          new Date(d.timestamp).toLocaleString("id-ID"),
          d.name,
          d.attendance,
          d.guests,
          d.message,
        ]);
        const csv = [headers, ...rows]
          .map((row) =>
            row.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","),
          )
          .join("\n");

        const blob = new Blob(["\ufeff" + csv], {
          type: "text/csv;charset=utf-8;",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `rsvp_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      document.getElementById("search").addEventListener("input", renderTable);
      document
        .getElementById("filterAtt")
        .addEventListener("change", renderTable);

      loadData();
      setInterval(loadData, 30 * 1000);
    </script>
  </body>
</html>
